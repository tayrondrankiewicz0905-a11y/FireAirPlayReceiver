
name: Build FireAirPlayReceiver APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-firetv.yml"

permissions:
  contents: read

jobs:
  build-firetv:
    name: Build Fire TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eigenes Repository
        uses: actions/checkout@v4

      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: PhairPlay-Quellcode holen
        run: |
          git clone --depth 1 \
            https://github.com/mazer666/PhairPlay.git phairplay

      - name: Android SDK-Komponenten installieren
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Fire-TV-APK bauen
        working-directory: phairplay
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFiretvDebug

      - name: APK als Build-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FireAirPlayReceiver-FireTV-APK
          path: phairplay/app/build/outputs/apk/firetv/debug/*.apk
          if-no-files-found: error
          retention-days: 14
